<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Free Video Chat — CooMeet & DZt Random Call</title>
  <meta name="description" content="Free instant random video chat with live webcam streaming, gender filters, and encrypted WebRTC connections.">
  <link rel="icon" href="https://space.coomeet.com/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #050505;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-black text-white h-screen flex flex-col">

  <!-- Top Navigation Header -->
  <header class="h-14 bg-neutral-900/90 border-b border-white/10 px-4 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-3">
      <a href="/" class="px-2.5 py-1 text-xs font-mono bg-white/10 hover:bg-white/20 text-white rounded border border-white/15 flex items-center gap-1.5 transition-all text-decoration-none">
        ← Return to Portfolio
      </a>
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span>
        <span class="font-bold text-sm tracking-wide">CooMeet Live Random Video</span>
      </div>
    </div>

    <div class="flex items-center gap-3 font-mono text-xs">
      <div class="hidden sm:flex items-center gap-1 text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded border border-emerald-500/20">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
        <span id="online-users-count">36,820 ONLINE</span>
      </div>
      <a href="https://space.coomeet.com" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 font-bold text-white rounded text-xs transition-all shadow-md">
        Launch Official CooMeet ↗
      </a>
    </div>
  </header>

  <!-- Video Chat Layout Area -->
  <main class="flex-1 flex flex-col lg:flex-row relative overflow-hidden">
    <!-- Main Video Partner Screen (Back/Remote Video Canvas) -->
    <div class="flex-1 relative flex items-center justify-center bg-black min-h-[350px]">
      <canvas id="partner-canvas" class="w-full h-full absolute inset-0 block object-cover"></canvas>

      <!-- Remote Partner Info Overlay -->
      <div id="partner-info-box" class="absolute top-4 left-4 z-20 bg-black/75 backdrop-blur-md border border-white/15 p-2.5 rounded text-white flex items-center gap-2.5 shadow-xl">
        <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>
        <div>
          <div class="font-bold text-sm" id="partner-name-tag">Elena Rostova, 21</div>
          <div class="text-xs text-white/60 font-mono" id="partner-loc-tag">UA • Kyiv, Ukraine</div>
        </div>
      </div>

      <!-- Action Floating Bar (Next, Like, Mic) -->
      <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex items-center gap-3 bg-black/80 backdrop-blur-md px-4 py-2.5 rounded-full border border-white/20 shadow-2xl">
        <button id="like-btn" class="px-3 py-2 bg-white/10 hover:bg-rose-600 rounded-full text-xs font-mono flex items-center gap-1.5 transition-all cursor-pointer">
          ❤️ <span id="likes-count">24</span>
        </button>
        <button id="next-btn" class="px-6 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-black font-black text-xs uppercase tracking-wider rounded-full shadow-lg transition-all cursor-pointer">
          ⏩ NEXT PARTNER
        </button>
        <button id="camera-flip-btn" class="px-3 py-2 bg-white/10 hover:bg-white/20 rounded-full text-xs font-mono text-cyan-300 flex items-center gap-1 transition-all cursor-pointer">
          🔄 Flip Camera
        </button>
      </div>
    </div>

    <!-- Right Sidebar: Local Camera & Chat Feed -->
    <div class="w-full lg:w-96 bg-neutral-950 border-t lg:border-t-0 lg:border-l border-white/10 flex flex-col justify-between p-3 font-sans">
      <!-- Local Camera Preview Box -->
      <div class="space-y-2">
        <div class="flex items-center justify-between text-xs font-mono text-white/60">
          <span>YOUR CAMERA PREVIEW</span>
          <span id="cam-status-pill" class="px-1.5 py-0.5 rounded text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">STREAM ON</span>
        </div>

        <div class="relative aspect-video w-full bg-black rounded border border-white/15 overflow-hidden">
          <video id="local-video" autoplay playsinline muted class="w-full h-full object-cover -scale-x-100"></video>
          <div id="cam-fallback-ui" class="absolute inset-0 flex flex-col items-center justify-center bg-black/90 p-4 text-center hidden">
            <p class="text-xs text-white/70 mb-2">Camera permission required</p>
            <button id="enable-cam-btn" class="px-3 py-1 bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-xs rounded">
              Enable Webcam
            </button>
          </div>
        </div>
      </div>

      <!-- Real-time Text Chat -->
      <div class="flex-1 flex flex-col h-56 lg:h-72 my-2 bg-white/5 rounded border border-white/10 p-2.5 justify-between">
        <div class="text-[11px] font-mono text-white/50 border-b border-white/10 pb-1 flex justify-between">
          <span>P2P ENCRYPTED CHAT</span>
          <span class="text-emerald-400">ONLINE</span>
        </div>

        <div id="chat-messages" class="flex-1 overflow-y-auto py-2 space-y-1.5 text-xs pr-1">
          <div class="bg-white/10 p-2 rounded max-w-[85%] leading-relaxed text-white/90">
            Hey! Nice to meet you 😊 How is your day going?
          </div>
        </div>

        <form id="chat-form" class="flex gap-1.5 pt-2 border-t border-white/10">
          <input type="text" id="chat-input" placeholder="Type a message..." class="flex-1 bg-black/60 border border-white/20 focus:border-rose-500 rounded px-2.5 py-1.5 text-xs text-white outline-none">
          <button type="submit" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs rounded transition-all">Send</button>
        </form>
      </div>
    </div>
  </main>

  <script>
    // State & Sample Partners
    const PARTNERS = [
      { name: "Elena Rostova, 21", loc: "UA • Kyiv, Ukraine", hue: 330, greeting: "Hey! Nice to meet you 😊 How is your day going?" },
      { name: "Sophia Chen, 23", loc: "TW • Taipei, Taiwan", hue: 190, greeting: "Hello from Taipei! Love tech and design 🎨" },
      { name: "Lucas Silva, 24", loc: "BR • São Paulo, Brazil", hue: 140, greeting: "Opa! What are you building today bro?" },
      { name: "Chloe Dubois, 22", loc: "FR • Paris, France", hue: 280, greeting: "Bonjour! Are you enjoying the video chat? ✨" },
      { name: "Yuki Tanaka, 20", loc: "JP • Tokyo, Japan", hue: 350, greeting: "Konnichiwa! Where are you connecting from? 🌸" }
    ];

    let currentPartnerIdx = 0;
    let facingMode = 'user';
    let currentStream = null;
    let likes = 24;

    const videoEl = document.getElementById('local-video');
    const canvas = document.getElementById('partner-canvas');
    const ctx = canvas.getContext('2d');
    const nextBtn = document.getElementById('next-btn');
    const flipBtn = document.getElementById('camera-flip-btn');
    const likeBtn = document.getElementById('like-btn');
    const likesCountEl = document.getElementById('likes-count');
    const nameTag = document.getElementById('partner-name-tag');
    const locTag = document.getElementById('partner-loc-tag');
    const chatBox = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const enableCamBtn = document.getElementById('enable-cam-btn');
    const camFallbackUi = document.getElementById('cam-fallback-ui');
    const camStatusPill = document.getElementById('cam-status-pill');

    // Start local camera
    async function startCamera(facing = 'user') {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
        videoEl.srcObject = currentStream;
        camFallbackUi.classList.add('hidden');
        camStatusPill.textContent = 'STREAM ON';
        camStatusPill.className = 'px-1.5 py-0.5 rounded text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
        if (facing === 'user') {
          videoEl.classList.add('-scale-x-100');
        } else {
          videoEl.classList.remove('-scale-x-100');
        }
      } catch (e) {
        console.warn('Camera permission:', e);
        camFallbackUi.classList.remove('hidden');
        camStatusPill.textContent = 'CAMERA OFF';
        camStatusPill.className = 'px-1.5 py-0.5 rounded text-[10px] bg-rose-500/20 text-rose-400 border border-rose-500/30';
      }
    }

    // Switch front/back camera
    flipBtn.addEventListener('click', () => {
      facingMode = facingMode === 'user' ? 'environment' : 'user';
      startCamera(facingMode);
    });

    enableCamBtn.addEventListener('click', () => startCamera(facingMode));

    // Partner canvas animation loop (Never goes black!)
    let time = 0;
    let isSearching = false;

    function renderCanvas() {
      time += 0.025;
      canvas.width = canvas.clientWidth || 800;
      canvas.height = canvas.clientHeight || 500;
      const w = canvas.width;
      const h = canvas.height;
      const p = PARTNERS[currentPartnerIdx];

      // Background
      const grad = ctx.createLinearGradient(0, 0, w, h);
      if (isSearching) {
        grad.addColorStop(0, '#0a0a0f');
        grad.addColorStop(0.5, '#120f24');
        grad.addColorStop(1, '#050508');
      } else {
        grad.addColorStop(0, `hsl(${p.hue}, 40%, 12%)`);
        grad.addColorStop(0.5, `hsl(${p.hue + 25}, 50%, 8%)`);
        grad.addColorStop(1, '#050508');
      }
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2 - 20;

      if (isSearching) {
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, 70 + Math.sin(time * 3) * 15, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('SEARCHING LIVE PEER...', cx, cy + 90);
      } else {
        // Glowing avatar
        const rad = Math.min(w, h) * 0.18 + Math.sin(time * 1.5) * 4;
        ctx.strokeStyle = `hsl(${p.hue}, 80%, 60%)`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(cx, cy, rad + 10, 0, Math.PI * 2);
        ctx.stroke();

        const pGrad = ctx.createLinearGradient(cx - rad, cy - rad, cx + rad, cy + rad);
        pGrad.addColorStop(0, `hsl(${p.hue}, 70%, 50%)`);
        pGrad.addColorStop(1, `hsl(${p.hue + 40}, 80%, 25%)`);
        ctx.fillStyle = pGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, rad, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${rad * 0.9}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.name.charAt(0), cx, cy);

        // Audio visualizer wave
        ctx.strokeStyle = 'rgba(16, 185, 129, 0.8)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        const waveY = h - 60;
        ctx.moveTo(w * 0.15, waveY);
        for (let x = w * 0.15; x <= w * 0.85; x += 10) {
          const normX = (x - w * 0.15) / (w * 0.7);
          const env = Math.sin(normX * Math.PI);
          const y = waveY + Math.sin(x * 0.05 + time * 6) * 15 * env;
          ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      requestAnimationFrame(renderCanvas);
    }

    function switchPartner() {
      isSearching = true;
      nameTag.textContent = "Connecting to new partner...";
      locTag.textContent = "Negotiating WebRTC stream...";

      setTimeout(() => {
        currentPartnerIdx = (currentPartnerIdx + 1) % PARTNERS.length;
        const p = PARTNERS[currentPartnerIdx];
        nameTag.textContent = p.name;
        locTag.textContent = p.loc;
        isSearching = false;
        likes = Math.floor(Math.random() * 30) + 8;
        likesCountEl.textContent = likes;

        chatBox.innerHTML = `
          <div class="bg-white/10 p-2 rounded max-w-[85%] leading-relaxed text-white/90">
            ${p.greeting}
          </div>
        `;
      }, 900);
    }

    nextBtn.addEventListener('click', switchPartner);
    likeBtn.addEventListener('click', () => {
      likes++;
      likesCountEl.textContent = likes;
    });

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = chatInput.value.trim();
      if (!val) return;
      chatInput.value = '';

      const userMsg = document.createElement('div');
      userMsg.className = 'bg-rose-600 text-white p-2 rounded max-w-[85%] ml-auto leading-relaxed';
      userMsg.textContent = val;
      chatBox.appendChild(userMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

      setTimeout(() => {
        const replies = ["Awesome!", "Totally agree with you! ✨", "Where are you from?", "Nice talking to you 😊"];
        const reply = document.createElement('div');
        reply.className = 'bg-white/10 p-2 rounded max-w-[85%] leading-relaxed text-white/90';
        reply.textContent = replies[Math.floor(Math.random() * replies.length)];
        chatBox.appendChild(reply);
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 1200);
    });

    // Boot
    startCamera('user');
    renderCanvas();
  </script>
</body>
</html>
